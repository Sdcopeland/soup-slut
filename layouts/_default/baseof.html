<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #3D2B24; /* Dark wood brown */
        }
        .font-brand {
            font-family: 'Playfair Display', serif;
        }
        .section-bg-dark {
             background-color: #3D2B24;
        }
        .section-bg-light {
            background-color: #F5EFE6; /* Creamy off-white */
        }
        .card-bg {
            background-color: #FFFFFF;
        }
    </style>
</head>
<body class="text-stone-800">

    <!-- Header / Navigation -->
    <header class="bg-[#3D2B24] bg-opacity-80 backdrop-blur-md p-4 fixed w-full top-0 z-50 shadow-lg">
        <nav class="container mx-auto flex justify-between items-center">
            <a href="#home" class="font-brand text-2xl font-bold text-orange-400">Soup Sluts</a>
            <div class="hidden md:flex space-x-8 text-stone-200">
                <a href="#home" class="hover:text-orange-300 transition-colors">Home</a>
                <a href="#details" class="hover:text-orange-300 transition-colors">Event Details</a>
                <a href="#register" class="hover:text-orange-300 transition-colors">Register</a>
                <a href="#vote" class="hover:text-orange-300 transition-colors">Vote</a>
            </div>
            <!-- Mobile Menu Button -->
            <button id="mobile-menu-button" class="md:hidden text-white">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" />
                </svg>
            </button>
        </nav>
        <!-- Mobile Menu -->
        <div id="mobile-menu" class="hidden md:hidden mt-4 text-stone-200">
             <a href="#home" class="block py-2 px-4 hover:bg-stone-700 rounded">Home</a>
             <a href="#details" class="block py-2 px-4 hover:bg-stone-700 rounded">Event Details</a>
             <a href="#register" class="block py-2 px-4 hover:bg-stone-700 rounded">Register</a>
             <a href="#vote" class="block py-2 px-4 hover:bg-stone-700 rounded">Vote</a>
        </div>
    </header>

    <main>
        {{ block "main" . }}{{ end }}
    </main>

    <footer class="bg-[#3D2B24] py-8 px-4 text-center">
        <p class="text-stone-400">&copy; 2025 Soup Sluts Community. All rights reserved.</p>
        <p class="text-stone-500 mt-2">Made with ❤️ and broth.</p>
    </footer>

    <script>
        // Simple mobile menu toggle
        const menuButton = document.getElementById('mobile-menu-button');
        const mobileMenu = document.getElementById('mobile-menu');
        menuButton.addEventListener('click', () => {
            mobileMenu.classList.toggle('hidden');
        });
        
        // Close mobile menu when a link is clicked
        const mobileLinks = mobileMenu.getElementsByTagName('a');
        for (const link of mobileLinks) {
            link.addEventListener('click', () => {
                 mobileMenu.classList.add('hidden');
            });
        }
    </script>
</body>
</html>
